[package]
name = "domador"
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Control de procesos y rendimiento para Windows, en Rust"

[[bin]]
name = "domador-tray"
path = "src/bin/tray.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
ctrlc = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
sysinfo = "0.33"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
